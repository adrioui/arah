<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arah ride check</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="masthead">
<h1>Arah ride check</h1>
<p class="lede">Curated Tangerang Selatan and Jakarta routes, checked against current flood, weather, and closure reports before you roll.</p>
<p class="meta"><span id="health">checking feed status</span></p>
</header>
<main class="layout">
<section class="checks" aria-label="Ride checks">
<h2>Pick a check</h2>
<div class="checklist">
<button type="button" data-check="long">Long ride, Binloop, morning</button>
<button type="button" data-check="night">Tempo loop at night</button>
<button type="button" data-check="cafe">Cafe run to Kemang</button>
</div>
<p class="note">Checks run on curated routes only. New roads join after a survey ride.</p>
</section>
<section class="result" aria-label="Decision">
<h2 id="resultTitle">No check yet</h2>
<svg id="trace" viewBox="0 0 600 360" role="img" aria-label="Selected route trace"></svg>
<ul id="candidates" class="candidates"></ul>
<div id="evidence" class="ledger"></div>
</section>
<section class="feedback" aria-label="Report">
<h2>Report something</h2>
<form id="feedbackForm">
<label>Route
<select id="feedbackRoute" name="route"></select>
</label>
<label>Kind
<select id="feedbackKind" name="kind">
<option value="hazard">Hazard</option>
<option value="closure">Closure</option>
<option value="praise">Clear road</option>
</select>
</label>
<label>What did you see
<input id="feedbackText" name="text" type="text" required maxlength="280" placeholder="Water across the lane near the market">
</label>
<button type="submit">Send report</button>
<p id="feedbackStatus" role="status"></p>
</form>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
